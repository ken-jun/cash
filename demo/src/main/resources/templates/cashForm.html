<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>支出計算</title>
</head>
<body>
<form action="/" th:object="${cashData}" method="post">
    <table>
        <tr>
            <td>
                <span th:text="*{id}"></span>
                <input type="hidden" th:field="*{id}">
            </td>
        </tr>
        <tr>
            <th>収入</th>
            <td><input type="text" th:field="*{income}" placeholder="入力してください"></td>
        </tr> 
        <tr>
            <th>カテゴリー</th>
            <td><input type="text" th:field="*{category}" placeholder="入力してください"></td>
        </tr>
        <tr>
            <th>日付</th>
            <td><input type="date" th:field="*{date}"></td>
        </tr>
    </table>
    <div th:if="${session.mode == 'update'}">
        <button type="submit" th:formaction="@{/cash/update}">更新</button>
        <button type="submit" th:formaction="@{/cash/delete}">削除</button>
        <button type="submit" th:formaction="@{/cash/cancel}">キャンセル</button>
    </div>
    <div th:if="${session.mode == 'create'}">
        <button type="submit" th:formaction="@{/cash/new}">登録</button>
        <button type="submit" th:formaction="@{/cash/cancel}">キャンセル</button>
    </div>
</form>
</body>
</html>
