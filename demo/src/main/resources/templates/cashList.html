<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支出計算</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-info mb-">
<nav class="navbar navbar-expand-lg bg-info fixed-top py-4" data-bs-theme="dark" id="navbar">
    <div class="container">
        <a class="navbar-brand text-dark" th:href="@{/}">
        <i class="bi bi-bank"></i>
            支出計算アプリ
        </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
        <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/}">ホーム</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark" th:href="@{/cash/new}">支出登録</a>
        </li>
    </ul>
</div>
</div>
</nav>

<section class="py-1 bg-info text-center">
<div class="container text-center" style="margin-top: 88px;">
    <div class="row">
        <div class="col">
            <p>お金を貯めましょう</p>
            <h2 class="mb-3">今月の支出合計を確認する</h2>
            <a href="/cash/result" class="btn btn-dark px-5 shadow">支出計算</a>
        </div>
    </div>
</div>
</section>

<div style="margin-top: 30px;">
<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
    <th>支出</th>
    <th>カテゴリー</th>
    <th>日付</th>
    <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cash : ${cashList}">
        <td th:text="${cash.expense}"></td>
        <td th:text="${cash.category}"></td>
        <td th:text="${cash.date}"></td>
        <td >
            <form th:action="@{/cash/{id}(id=${cash.id})}" method="post">
                <button type="submit">編集</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
