<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支出計算</title>
</head>
<body>
<table border="1">
    <tr>
    <th>収入</th>
    <th>合計</th>
    <th>日付</th>
    </tr>
    <tr th:each="cash : ${cashList}">
        <td th:text="${cash.income}"></td>
        <td th:text="${cash.amount}"></td>
        <td th:text="${cash.date}"></td>
    </tr>
</table>
</body>
</html>
